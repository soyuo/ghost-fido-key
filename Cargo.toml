[workspace]
resolver = "2"
members = [
    "crates/ghost-fido-core",
    "crates/ghost-platform",
    "apps/ghost-fido",
    "apps/desktop/src-tauri",
]

[patch.crates-io]
uhid-virt = { path = "vendor/uhid-virt" }

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[workspace]
resolver = "2"
members = [
    "crates/ghost-fido-core",
    "crates/ghost-platform",
    "apps/ghost-fido",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

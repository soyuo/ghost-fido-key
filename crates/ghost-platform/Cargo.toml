[package]
name = "ghost-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version = "1.88"

[lints]
workspace = true

[dependencies]
ghost-fido-core = { path = "../ghost-fido-core" }
getrandom = "0.3.4"
sha2 = "0.10.9"
subtle = "2.6.1"
zeroize = "1"

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# aes-gcm's zeroize feature does not forward to GHASH or POLYVAL.
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
libc = "0.2"
dbus-secret-service = { version = "=4.1.0", default-features = false, features = ["crypto-rust"] }
p256 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "std"] }
uuid = { version = "1", features = ["v4"] }
uhid-virt = "0.0.8"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
# aes-gcm's zeroize feature does not forward to GHASH or POLYVAL.
ghash = { version = "0.5", features = ["zeroize"] }
polyval = { version = "0.6.2", features = ["zeroize"] }
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_IO"] }
uuid = { version = "1", features = ["v4"] }

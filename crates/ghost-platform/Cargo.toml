[package]
name = "ghost-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
ghost-fido-core = { path = "../ghost-fido-core" }
getrandom = "0.3.4"
sha2 = "0.10.9"

[target.'cfg(target_os = "linux")'.dependencies]
aes-gcm = "0.10.3"
libc = "0.2"
secret-service = { version = "=5.1.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "std"] }
uuid = { version = "1", features = ["v4"] }
uhid-virt = "0.0.8"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = "0.10.3"
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
security-framework-sys = "=2.17.0"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
uuid = { version = "1", features = ["v4"] }

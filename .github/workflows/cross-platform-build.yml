name: Cross-platform build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      vendor_id:
        description: Assigned product vendor ID in hexadecimal (for example, 0x1234)
        required: false
        type: string
        default: "0x0000"
      product_id:
        description: Assigned product ID in hexadecimal (for example, 0x0001)
        required: false
        type: string
        default: "0x0000"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04-arm
          - windows-2025-vs2026
          - macos-15
          - macos-15-intel

    steps:
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libdbus-1-dev \
            libayatana-appindicator3-dev \
            libclang-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - uses: actions/checkout@v7

      - name: Verify native Linux ARM64 runner
        if: matrix.os == 'ubuntu-24.04-arm'
        run: |
          test "$(uname -m)" = "aarch64"
          test "$(dpkg --print-architecture)" = "arm64"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Add MSBuild to PATH
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Restore Windows UDE WDK packages
        if: runner.os == 'Windows'
        run: nuget restore platforms/windows/ude/packages.config -PackagesDirectory platforms/windows/ude/packages

      - name: Install Windows Driver Kit packaging tools
        if: runner.os == 'Windows'
        run: winget install --id Microsoft.WindowsWDK.10.0.28000 --exact --accept-source-agreements --accept-package-agreements --silent

      - name: Validate optional assigned Windows UDE identity
        if: runner.os == 'Windows'
        id: ude_identity
        shell: pwsh
        env:
          GHOST_FIDO_VENDOR_ID_INPUT: ${{ inputs.vendor_id || '0x0000' }}
          GHOST_FIDO_PRODUCT_ID_INPUT: ${{ inputs.product_id || '0x0000' }}
        run: |
          $vendorText = $env:GHOST_FIDO_VENDOR_ID_INPUT
          $productText = $env:GHOST_FIDO_PRODUCT_ID_INPUT
          if ($vendorText -notmatch '^0[xX][0-9A-Fa-f]{1,4}$' -or $productText -notmatch '^0[xX][0-9A-Fa-f]{1,4}$') {
            throw 'Vendor and product IDs must each be hexadecimal values from 0x0000 through 0xFFFF.'
          }

          $vendorId = [Convert]::ToUInt16($vendorText.Substring(2), 16)
          $productId = [Convert]::ToUInt16($productText.Substring(2), 16)
          if (($vendorId -eq 0) -xor ($productId -eq 0)) {
            throw 'Vendor and product IDs must both be zero or both be assigned nonzero values.'
          }
          if ($vendorId -eq 0xFFFF -or $productId -eq 0xFFFF) {
            throw '0xFFFF is reserved and cannot be used as a product identity.'
          }

          $output = "vendor_id=0x{0:X4}`nproduct_id=0x{1:X4}`n" -f $vendorId, $productId
          [System.IO.File]::AppendAllText($env:GITHUB_OUTPUT, $output, [System.Text.UTF8Encoding]::new($false))

      - name: Build Windows UDE driver for x64
        if: runner.os == 'Windows'
        env:
          GHOST_FIDO_VENDOR_ID: ${{ steps.ude_identity.outputs.vendor_id }}
          GHOST_FIDO_PRODUCT_ID: ${{ steps.ude_identity.outputs.product_id }}
        run: msbuild platforms/windows/ude/ghost-fido-ude.vcxproj /m /p:Configuration=Release /p:Platform=x64 "/p:GhostFidoVendorId=$env:GHOST_FIDO_VENDOR_ID" "/p:GhostFidoProductId=$env:GHOST_FIDO_PRODUCT_ID"

      - name: Verify Windows UDE x64 driver output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $driver = Join-Path $env:GITHUB_WORKSPACE 'target/windows-ude/x64/Release/GhostFidoUde.sys'
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw "The x64 UDE driver build did not produce $driver"
          }
          Get-Item -LiteralPath $driver | Select-Object FullName, Length

      - name: Build Windows UDE driver for ARM64
        if: runner.os == 'Windows'
        env:
          GHOST_FIDO_VENDOR_ID: ${{ steps.ude_identity.outputs.vendor_id }}
          GHOST_FIDO_PRODUCT_ID: ${{ steps.ude_identity.outputs.product_id }}
        run: msbuild platforms/windows/ude/ghost-fido-ude.vcxproj /m /p:Configuration=Release /p:Platform=ARM64 "/p:GhostFidoVendorId=$env:GHOST_FIDO_VENDOR_ID" "/p:GhostFidoProductId=$env:GHOST_FIDO_PRODUCT_ID"

      - name: Verify Windows UDE ARM64 driver output
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $driver = Join-Path $env:GITHUB_WORKSPACE 'target/windows-ude/ARM64/Release/GhostFidoUde.sys'
          if (-not (Test-Path -LiteralPath $driver -PathType Leaf)) {
            throw "The ARM64 UDE driver build did not produce $driver"
          }
          Get-Item -LiteralPath $driver | Select-Object FullName, Length

      - name: Package Windows UDE driver for x64 and ARM64
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./platforms/windows/ude/New-DriverPackages.ps1

      - name: Upload unsigned Windows UDE development packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-ude-unsigned-development-packages
          path: target/windows-ude/packages/
          if-no-files-found: error
          retention-days: 7

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Test desktop library
        if: runner.os == 'Linux' || runner.os == 'Windows'
        run: cargo test --package ghost-fido-desktop --lib --locked

      - name: Link macOS desktop application with CoreHID bridge
        if: runner.os == 'macOS'
        run: cargo build --package ghost-fido-desktop --locked

      - name: Build macOS CoreHID Swift bridge for Intel and Apple silicon
        if: runner.os == 'macOS'
        run: |
          swift build --package-path platforms/macos/corehid --scratch-path "$RUNNER_TEMP/corehid-x86_64" --triple x86_64-apple-macosx15.0 --configuration release --product ghost_fido_corehid
          swift build --package-path platforms/macos/corehid --scratch-path "$RUNNER_TEMP/corehid-arm64" --triple arm64-apple-macosx15.0 --configuration release --product ghost_fido_corehid

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Build frontend
        run: npm --prefix apps/desktop run build

      - name: Build native macOS Intel development app bundle
        if: runner.os == 'macOS' && runner.arch == 'X64'
        run: npm --prefix apps/desktop run tauri -- build --bundles app

      - name: Build native macOS development bundles
        if: runner.os == 'macOS' && runner.arch != 'X64'
        run: npm --prefix apps/desktop run tauri -- build --bundles app,dmg

      - name: Verify macOS development bundle outputs
        if: runner.os == 'macOS' && runner.arch != 'X64'
        shell: bash
        run: |
          app="$(find target/release/bundle/macos -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          dmg="$(find target/release/bundle/dmg -mindepth 1 -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          if [[ -z "$app" || -z "$dmg" ]]; then
            echo "Tauri did not produce both the macOS app bundle and DMG" >&2
            exit 1
          fi
          du -sh "$app" "$dmg"

      - name: Verify macOS Intel development app output
        if: runner.os == 'macOS' && runner.arch == 'X64'
        shell: bash
        run: |
          app="$(find target/release/bundle/macos -mindepth 1 -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app" ]]; then
            echo "Tauri did not produce the macOS Intel app bundle" >&2
            exit 1
          fi
          du -sh "$app"

      - name: Upload unsigned macOS development bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ runner.arch }}-unsigned-development-bundles
          path: |
            target/release/bundle/macos/*.app
            target/release/bundle/dmg/*.dmg
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Windows x64 NSIS development installer
        if: runner.os == 'Windows'
        run: npm --prefix apps/desktop run tauri -- build --bundles nsis

      - name: Verify Windows NSIS development installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*.exe' -File | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -eq 0) {
            throw 'Tauri did not produce a non-empty Windows NSIS setup executable'
          }
          $installer | Select-Object FullName, Length

      - name: Upload unsigned Windows desktop development installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: windows-${{ runner.arch }}-unsigned-development-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

      - name: Build Linux Debian package
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop run tauri -- build --bundles deb

      - name: Verify Debian package includes the UHID rule
        if: runner.os == 'Linux'
        id: verify-debian-package
        shell: bash
        run: |
          package="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Tauri did not produce a Debian package" >&2
            exit 1
          fi
          if [[ ! -s "$package" ]]; then
            echo "Tauri produced an empty Debian package" >&2
            exit 1
          fi
          contents="$(dpkg-deb --contents "$package")"
          printf '%s\n' "$contents"
          if ! grep -Fq 'usr/lib/udev/rules.d/70-ghost-fido-key.rules' <<< "$contents"; then
            echo "The Debian package is missing the UHID udev rule" >&2
            exit 1
          fi
          echo "package=$package" >> "$GITHUB_OUTPUT"

      - name: Upload unsigned Linux Debian development package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: linux-${{ runner.arch }}-unsigned-development-debian-package
          path: ${{ steps.verify-debian-package.outputs.package }}
          if-no-files-found: error
          retention-days: 7

  windows-arm64-desktop:
    name: Build Windows ARM64 desktop development installer
    runs-on: windows-11-vs2026-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Verify native Windows ARM64 runner
        shell: pwsh
        run: |
          if ($env:PROCESSOR_ARCHITECTURE -ne 'ARM64') {
            throw "Expected an ARM64 runner, got $env:PROCESSOR_ARCHITECTURE"
          }
          $rustInfo = (rustc -vV) -join "`n"
          $rustInfo
          if ($rustInfo -notmatch '(?m)^host: aarch64-pc-windows-msvc$') {
            throw 'The Rust toolchain host is not Windows ARM64'
          }

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Build Windows ARM64 NSIS development installer
        run: npm --prefix apps/desktop run tauri -- build --bundles nsis

      - name: Verify Windows ARM64 app and installer architecture
        shell: pwsh
        run: |
          $app = Get-Item -LiteralPath 'target/release/ghost-fido-desktop.exe'
          $stream = [System.IO.File]::OpenRead($app.FullName)
          try {
            $reader = [System.IO.BinaryReader]::new($stream)
            $stream.Position = 0x3C
            $peOffset = $reader.ReadInt32()
            $stream.Position = $peOffset
            if ($reader.ReadUInt32() -ne 0x00004550) {
              throw 'The desktop application does not have a valid PE signature'
            }
            if ($reader.ReadUInt16() -ne 0xAA64) {
              throw 'The desktop application executable is not ARM64'
            }
          } finally {
            $stream.Dispose()
          }
          $installer = Get-ChildItem -LiteralPath 'target/release/bundle/nsis' -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -eq 0) {
            throw 'Tauri did not produce a non-empty Windows ARM64 NSIS installer'
          }
          $app | Select-Object FullName, Length
          $installer | Select-Object FullName, Length

      - name: Upload unsigned Windows ARM64 desktop development installer
        uses: actions/upload-artifact@v7
        with:
          name: windows-arm64-unsigned-development-installer
          path: target/release/bundle/nsis/**/*.exe
          if-no-files-found: error
          retention-days: 7

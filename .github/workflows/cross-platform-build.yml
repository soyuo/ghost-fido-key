name: Cross-platform build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-latest
          - macos-14

    steps:
      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libclang-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --locked

      - name: Install frontend dependencies
        run: npm ci --prefix apps/desktop

      - name: Build frontend
        run: npm --prefix apps/desktop run build

      - name: Build Linux Debian package
        if: runner.os == 'Linux'
        run: npm --prefix apps/desktop run tauri -- build --bundles deb

      - name: Verify Debian package includes the UHID rule
        if: runner.os == 'Linux'
        shell: bash
        run: |
          package="$(find target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          if [[ -z "$package" ]]; then
            echo "Tauri did not produce a Debian package" >&2
            exit 1
          fi
          contents="$(dpkg-deb --contents "$package")"
          printf '%s\n' "$contents"
          if ! grep -Fq 'usr/lib/udev/rules.d/70-ghost-fido-key.rules' <<< "$contents"; then
            echo "The Debian package is missing the UHID udev rule" >&2
            exit 1
          fi

name: Dependency security audit

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Audit locked dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2

      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit desktop frontend dependencies
        run: npm audit --prefix apps/desktop --package-lock-only --audit-level=low

      - name: Install local WebAuthn RP dependencies
        run: npm ci --prefix tools/webauthn-test-rp

      - name: Check local WebAuthn RP JavaScript syntax
        run: npm run check --prefix tools/webauthn-test-rp

      - name: Audit local WebAuthn RP dependencies
        run: npm audit --prefix tools/webauthn-test-rp --audit-level=low

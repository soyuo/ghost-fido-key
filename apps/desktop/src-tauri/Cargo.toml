[package]
name = "ghost-fido-desktop"
version = "0.1.0"
description = "Ghost FIDO Key desktop application"
authors = ["Ghost FIDO Key contributors"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ghost_fido_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ghost-fido-core = { path = "../../../crates/ghost-fido-core" }
ghost-platform = { path = "../../../crates/ghost-platform" }
fs4 = { version = "1.1", features = ["sync"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.11", features = ["v4"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_RemoteDesktop",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18.4"

